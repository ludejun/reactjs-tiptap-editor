name: 📘 Docs and playground on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The playground imports the built library.
      - run: pnpm build:lib
      # Docs at /ai-sparkwrite-editor/, the live playground at /ai-sparkwrite-editor/playground/.
      - run: pnpm --dir docs run build
        env:
          DOCS_BASE: /ai-sparkwrite-editor/
      - run: pnpm --dir playground exec vite build --base /ai-sparkwrite-editor/playground/ --outDir ../docs/.vitepress/dist/playground --emptyOutDir
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
